[project]
name = "talentping-backend"
version = "0.1.0"
description = "TalentPing — AI-powered recruiter outreach automation (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "redis>=5.0",
    # Reading uploaded resumes (pypdf) and rendering the tailored one back out
    # (reportlab). Kept as a real PDF rather than Markdown because it is what
    # gets attached to an application, and an ATS parses a PDF.
    "pypdf>=4.2",
    "reportlab>=4.1",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    # OAuth token encryption at rest (Fernet).
    "cryptography>=42.0",
    # Career-page scraping.
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    # Not wired into `addopts` — coverage is a thing you go looking for, and
    # paying for the tracer on every run makes the suite slower for no benefit.
    # `pytest --cov=app --cov-report=term-missing` when you want it.
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# Career-page form auto-apply (browser agent). Opt-in: it pulls a heavy browser
# binary, and the service degrades gracefully to "unsupported" without it.
browser = [
    "playwright>=1.44",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set has widened across releases, and
# `ruff>=0.5` in CI resolves to whatever is current, so relying on the default
# made lint results depend on the install date.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    # `x: Type = Depends(...)` / `File(...)` is the FastAPI idiom for dependency
    # injection — the whole API surface would need noqa without this.
    "B008",
    # `class X(str, Enum)` is deliberate: the members must compare equal to their
    # stored string for SQLAlchemy's non-native Enum columns and for Pydantic
    # serialization. StrEnum is not a drop-in replacement here.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes the column definitions in an autogenerated `op.create_table`,
# and they run past the line limit. A migration is a historical record of one
# schema change, so rewrapping them buys readability in a file nobody reads and
# costs a diff on something that must never change meaning. Every other rule —
# imports, unused names, modern syntax — still applies here.
"alembic/versions/*" = ["E501"]
